<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="text-primary mb-4">
            Welcome {{ student[1] }}
        </h1>

        <table class="table table-bordered">

            <tr>
                <th>Name</th>
                <td>{{ student[1] }}</td>
            </tr>

            <tr>
                <th>Semester</th>
                <td>{{ student[2] }}</td>
            </tr>

            <tr>
                <th>Branch</th>
                <td>{{ student[3] }}</td>
            </tr>

            <tr>
                <th>Email</th>
                <td>{{ student[4] }}</td>
            </tr>

            <tr>
                <th>Roll No</th>
                <td>{{ student[5] }}</td>
            </tr>

            <tr>
                <th>Mobile</th>
                <td>{{ student[6] }}</td>
            </tr>

        </table>

        <div>

            <a href="/edit/{{ student[0] }}"
               class="btn btn-primary">
               Edit Profile
            </a>

            <a href="/delete/{{ student[0] }}"
               class="btn btn-danger"
               onclick="return confirm('Delete Account?')">
               Delete Account
            </a>

        </div>

    </div>

</div>

</body>
</html>
