<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Student Management System</h1>

<a href="/add">Add Student</a>

<table>
    <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Semester</th>
    <th>Branch</th>
    <th>Email</th>
    <th>Roll No</th>
    <th>Mobile</th>
    <th>Action</th>
</tr>
   

    {% for student in students %}
    <tr>
       <td>{{ student[0] }}</td>
<td>{{ student[1] }}</td>
<td>{{ student[2] }}</td>
<td>{{ student[3] }}</td>
<td>{{ student[4] }}</td>
<td>{{ student[5] }}</td>
<td>{{ student[6] }}</td>
        <td>
            <a href="/edit/{{ student[0] }}">Edit</a>
            <a href="/delete/{{ student[0] }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
