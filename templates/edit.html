<html>
<head>
    <title>Edit Student</title>
</head>
<body>

<h1>Edit Student</h1>

<form method="POST">

    <input type="text" name="name" value="{{ student[1] }}">
    <br><br>

    <input type="text" name="semester" value="{{ student[2] }}">
    <br><br>

    <input type="text" name="branch" value="{{ student[3] }}">
    <br><br>

    <input type="email" name="email" value="{{ student[4] }}">
    <br><br>

    <input type="text" name="roll" value="{{ student[5] }}">
    <br><br>

    <input type="text" name="mobile" value="{{ student[6] }}">
    <br><br>

    <button type="submit">Update</button>

</form>

</body>
</html>
